<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px system-ui, sans-serif; width: 260px; margin: 12px; color: #111; }
    h1 { font-size: 14px; margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; }
    .dot.rec { background: #dc2626; }
    .row { display: flex; gap: 6px; margin: 8px 0; }
    button { flex: 1; padding: 6px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; }
    button.primary { background: #111; color: #fff; border-color: #111; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 8px 0 0; color: #374151; }
    dt { color: #6b7280; }
    .err { color: #b91c1c; margin-top: 6px; word-break: break-word; }
    .hint { color: #6b7280; font-size: 12px; }
  </style>
</head>
<body>
  <h1><span id="dot" class="dot"></span><span id="status">ToolSmith Recorder</span></h1>
  <div class="row">
    <button id="start" class="primary">Start recording</button>
    <button id="pause">Pause</button>
    <button id="stop">Stop</button>
  </div>
  <dl>
    <dt>Allow-list</dt><dd id="origins"></dd>
    <dt>Session</dt><dd id="session">—</dd>
    <dt>Sent</dt><dd id="sent">—</dd>
    <dt>Queued</dt><dd id="queued">—</dd>
    <dt>Dropped here</dt><dd id="dropped">—</dd>
  </dl>
  <div id="error" class="err"></div>
  <p class="hint">Only allow-listed sites are recorded. Typed text is never read, only its length. Password fields are never captured.</p>
  <script src="dist/popup.js"></script>
</body>
</html>
