services:
  api:
    image: python:3.11-slim
    working_dir: /workspace/backend
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    command: >-
      sh -c "pip install -r requirements/base.txt &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
  worker:
    image: python:3.11-slim
    working_dir: /workspace/backend
    volumes:
      - .:/workspace
    command: sh -c "pip install -r requirements/base.txt && python worker.py"
  web:
    profiles: [frontend]
    image: node:20-slim
    working_dir: /workspace/web
    volumes:
      - .:/workspace
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
      NEXT_PUBLIC_USE_MOCKS: "true"
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
  mocksite:
    profiles: [frontend]
    image: python:3.11-slim
    working_dir: /workspace/mocksite
    volumes:
      - .:/workspace
    ports:
      - "8081:8081"
    command: python server.py
